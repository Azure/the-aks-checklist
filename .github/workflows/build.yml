name: Validation Build 

on:
  pull_request:
    branches:
      - staging
      - master
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [10.x]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Check that data is OK
      run: . ./.github/scripts/check-unique-guid.sh
    

    - name: Check that data is OK
      run: . ./.github/scripts/check-unique-guid.sh
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ matrix.node-version }}
        
    - run: npm install

    - run: gulp build

    - name: Get current time
      uses: josStorer/get-current-time@5979d2f4455ed5df566aa6df67cedd77d17afaa9 # v2.1.1
      id: current-time
      with:
        format: DD-MM-YYYY

    - name: inject date
      uses: cschleiden/replace-tokens@8e091844c27eb36853efbfade5ffca07260f0250 # v1.2
      with:
        files: '["**/*.html"]'
      env:
        BUILD_DATE: "${{ steps.current-time.outputs.formattedTime }}"

    - name: Run the Transformer
      run: |
        pushd ./data/scripts
        pip3 install pandas
        python ./transform_to_ft.py
        popd

    - name: Run the Transformer
      run: |
        pushd ./data/scripts
        pip3 install pandas
        python ./transform_to_ft.py
        popd

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: CheckList
        path: dist
